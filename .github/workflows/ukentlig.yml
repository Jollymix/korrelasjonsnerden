name: Ukentlig tullkorrelasjon

on:
  schedule:
    - cron: '0 6 * * 1'   # hver mandag kl 06:00 UTC
  workflow_dispatch: {}    # lar deg trigge manuelt fra Actions-fanen

permissions:
  contents: write

jobs:
  bygg:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Kjernescriptet bruker kun standardbiblioteket — eneste avhengighet
      # er anthropic-pakken til "Nerden spekulerer" (se requirements.txt).
      - name: Installer avhengigheter
        run: pip install -r requirements.txt

      - name: Kjør tullkorrelasjon.py
        run: python tullkorrelasjon.py
        env:
          # Må legges inn som repo-secret (Settings → Secrets and variables
          # → Actions) for at "Nerden spekulerer" skal bruke ekte
          # Claude-generert tekst. Uten den brukes statisk fallback-tekst —
          # scriptet feiler ikke.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Commit og push index.html + arkiv
        run: |
          git config user.name "tullkorrelasjon-bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html arkiv
          git commit -m "Ukens tullkorrelasjon" || echo "Ingen endring å committe"

          # Scriptet bruker halvannet minutt+ på SSB-kall før dette steget,
          # så main kan ha beveget seg i mellomtiden (manuell trigger,
          # samtidig kjøring e.l.) — push kan da bli avvist ("fetch first").
          # Hent inn nyeste main og prøv på nytt et par ganger. Ved
          # konflikt vinner VÅR nettopp genererte index.html/arkiv-fil
          # (-X ours) — det er alltid riktig for disse maskingenererte
          # øyeblikksbildene at den sist ferdige kjøringen representerer
          # "ukens" resultat.
          for forsok in 1 2 3 4 5; do
            if git push; then
              exit 0
            fi
            echo "Push avvist (forsøk $forsok) — henter main på nytt og prøver igjen ..."
            git fetch origin main
            git merge -X ours --no-edit origin/main
          done
          echo "Klarte ikke pushe etter flere forsøk." >&2
          exit 1
